name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.18.0'
          cache: npm
          cache-dependency-path: package/webadmin/package-lock.json
      - name: Verify source and release-tag versions
        run: python3 scripts/verify-package.py
      - name: Install pinned OIE compile inputs
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/oie.tar.gz" https://github.com/OpenIntegrationEngine/engine/releases/download/v4.6.0/oie_unix_4_6_0.tar.gz
          echo "7c82e79027e671277e1d78d0f7bbb1c53ddf1be476f1e80c2ddbfcf7855900ea  $RUNNER_TEMP/oie.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/engine-inputs"
          tar -xzf "$RUNNER_TEMP/oie.tar.gz" -C "$RUNNER_TEMP/engine-inputs" \
            oie/server-lib/mirth-server.jar oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-model.jar oie/server-lib/donkey/donkey-server.jar
          ENGINE_DIR="$RUNNER_TEMP/engine-inputs/oie" bash scripts/install-engine-jars.sh
          rm -rf "$RUNNER_TEMP/engine-inputs"
      - name: Build package and run JVM and JavaScript tests
        run: mvn -B -ntp clean verify
      - name: Install Chromium
        working-directory: package/webadmin
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        working-directory: package/webadmin
        run: npm run test:browser
      - name: Validate the installable package
        run: |
          python3 scripts/verify-package.py package/target/oie-debugger-*.zip
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install into OIE and exercise the real Web Administrator
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/websupport.zip" https://github.com/gibson9583/oie-web-support-plugin/releases/download/v1.0.5/websupport-1.0.5.zip
          echo "ee7952e42bd1282727ee77cad529c0676557b1dc615c03548bd6676373214755  $RUNNER_TEMP/websupport.zip" | sha256sum -c -
          python3 scripts/test-engine.py --engine "$RUNNER_TEMP/oie.tar.gz" \
            --web-support "$RUNNER_TEMP/websupport.zip" --package package/target/oie-debugger-*.zip \
            --output test-results/engine --artifacts "$RUNNER_TEMP/debugger-runtime-inputs/sha256" --benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: |
            shared/target/surefire-reports/
            server/target/surefire-reports/
            test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debugger-package
          path: package/target/oie-debugger-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: debugger-runtime-inputs
          path: ${{ runner.temp }}/debugger-runtime-inputs/sha256/
