name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  signing-checks:
    uses: ./.github/workflows/signing-checks.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    needs: [validate, signing-checks]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          # The by-tag endpoint only promises published releases. Listing with
          # this job's write access also finds drafts from interrupted uploads.
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100",
          ], text=True, timeout=60))
          if any(release['tag_name'] == os.environ['GITHUB_REF_NAME']
                 for page in pages for release in page):
              raise SystemExit('A release already exists for this tag. See docs/releasing.md; existing assets will not be replaced.')
          PYTHON

      - name: Set up JDK 11 for CodeSignTool
        id: codesign-java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17 for verification
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check CodeSignTool JAR compatibility without credentials
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
        run: python3 .github/signing/sign_release.py --check-tool

      - name: Check SSL.com signing configuration
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py --check-config

      - name: Download the package built and tested by CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debugger-package
          path: package/target

      - name: Verify the unsigned package
        run: python3 scripts/verify-package.py package/target/oie-debugger-*.zip

      - name: Sign and verify release JARs with SSL.com
        env:
          CODESIGNTOOL_JAVA: ${{ steps.codesign-java.outputs.path }}/bin/java
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py

      - name: Verify and checksum the signed package
        run: |
          python3 scripts/verify-package.py package/target/oie-debugger-*.zip
          mkdir -p out
          cp -- "package/target/oie-debugger-${GITHUB_REF_NAME#v}.zip" out/
          cd out
          sha256sum -- *.zip > SHA256SUMS

      - name: Create and publish a new complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/signing/publish_release.py
